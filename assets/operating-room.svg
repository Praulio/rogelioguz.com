<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1750" viewBox="0 0 1400 1750" role="img" aria-labelledby="title desc">
  <title id="title">Mesa de trabajo de IA aplicada</title>
  <desc id="desc">Ilustracion editorial de documentos, pizarron, laptop y mapa de workflows operativos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset=".52" stop-color="#dfe7d4"/>
      <stop offset="1" stop-color="#7aa0a0"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#103c3a"/>
      <stop offset="1" stop-color="#071f1f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#103c3a" flood-opacity=".18"/>
    </filter>
    <pattern id="grid" width="62" height="62" patternUnits="userSpaceOnUse">
      <path d="M62 0H0V62" fill="none" stroke="#103c3a" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="1750" fill="url(#bg)"/>
  <rect width="1400" height="1750" fill="url(#grid)" opacity=".7"/>
  <circle cx="1170" cy="210" r="250" fill="#b9dc64" opacity=".28"/>
  <circle cx="140" cy="1430" r="340" fill="#fffdf7" opacity=".55"/>

  <g transform="translate(150 175)" filter="url(#shadow)">
    <rect x="0" y="0" width="1100" height="1320" rx="36" fill="#fffdf7"/>
    <rect x="44" y="44" width="1012" height="1232" rx="24" fill="#f7f4ec" stroke="#103c3a" stroke-opacity=".18"/>
  </g>

  <g transform="translate(230 255)">
    <text x="0" y="0" fill="#103c3a" font-family="Avenir Next, Manrope, sans-serif" font-size="28" font-weight="800" letter-spacing="6">IA APLICADA</text>
    <text x="0" y="72" fill="#17201e" font-family="Georgia, serif" font-size="86">Operacion a workflow</text>
    <path d="M0 112H860" stroke="#103c3a" stroke-opacity=".22" stroke-width="2"/>
  </g>

  <g transform="translate(230 455)">
    <rect x="0" y="0" width="380" height="300" rx="22" fill="#103c3a"/>
    <text x="34" y="58" fill="#b9dc64" font-family="Avenir Next, Manrope, sans-serif" font-size="18" font-weight="800" letter-spacing="4">INPUTS</text>
    <rect x="34" y="94" width="250" height="18" rx="9" fill="#fffdf7" opacity=".86"/>
    <rect x="34" y="136" width="300" height="18" rx="9" fill="#fffdf7" opacity=".62"/>
    <rect x="34" y="178" width="210" height="18" rx="9" fill="#fffdf7" opacity=".72"/>
    <rect x="34" y="220" width="286" height="18" rx="9" fill="#fffdf7" opacity=".42"/>
  </g>

  <g transform="translate(690 455)">
    <rect x="0" y="0" width="390" height="300" rx="22" fill="#fffdf7" stroke="#103c3a" stroke-opacity=".2"/>
    <text x="34" y="58" fill="#103c3a" font-family="Avenir Next, Manrope, sans-serif" font-size="18" font-weight="800" letter-spacing="4">CRITERIO</text>
    <circle cx="106" cy="156" r="54" fill="#b9dc64"/>
    <circle cx="196" cy="156" r="54" fill="#356b76" opacity=".9"/>
    <circle cx="286" cy="156" r="54" fill="#103c3a" opacity=".94"/>
    <path d="M106 156H286" stroke="#17201e" stroke-opacity=".28" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(230 835)">
    <rect x="0" y="0" width="850" height="230" rx="24" fill="#dfe7d4" stroke="#103c3a" stroke-opacity=".2"/>
    <text x="34" y="58" fill="#103c3a" font-family="Avenir Next, Manrope, sans-serif" font-size="18" font-weight="800" letter-spacing="4">WORKFLOW</text>
    <g fill="none" stroke="#103c3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M80 145H250"/>
      <path d="M250 145l-20-18m20 18l-20 18"/>
      <path d="M330 145H500"/>
      <path d="M500 145l-20-18m20 18l-20 18"/>
      <path d="M580 145H750"/>
      <path d="M750 145l-20-18m20 18l-20 18"/>
    </g>
    <g font-family="Avenir Next, Manrope, sans-serif" font-size="22" font-weight="800" fill="#17201e">
      <text x="64" y="130">Entrada</text>
      <text x="315" y="130">Decision</text>
      <text x="584" y="130">Salida</text>
    </g>
  </g>

  <g transform="translate(230 1140)">
    <rect x="0" y="0" width="410" height="250" rx="22" fill="#fffdf7" stroke="#103c3a" stroke-opacity=".2"/>
    <text x="34" y="58" fill="#103c3a" font-family="Avenir Next, Manrope, sans-serif" font-size="18" font-weight="800" letter-spacing="4">ADOPCION</text>
    <path d="M46 112h310M46 160h250M46 208h290" stroke="#103c3a" stroke-opacity=".28" stroke-width="18" stroke-linecap="round"/>
  </g>
  <g transform="translate(700 1140)">
    <rect x="0" y="0" width="380" height="250" rx="22" fill="url(#dark)"/>
    <text x="34" y="58" fill="#b9dc64" font-family="Avenir Next, Manrope, sans-serif" font-size="18" font-weight="800" letter-spacing="4">OUTPUT</text>
    <path d="M64 164l72 72 178-178" fill="none" stroke="#b9dc64" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
